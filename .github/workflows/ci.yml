name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Preview conformance (0.0.1–0.0.3)
        run: pnpm conformance:preview

      - name: Homepage client (Pages static)
        run: pnpm home:client

      - name: Homepage server (ServerArtifact → CVO host)
        run: pnpm home:server

      - name: Wrangler dry-run (homepage-api)
        run: pnpm --filter @cvo/homepage-api run dry-run
