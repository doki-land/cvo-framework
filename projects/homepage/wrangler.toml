name = "cvo-homepage"
compatibility_date = "2024-11-01"
main = "worker/index.ts"
workers_dev = true

# VMZ static build output (`pnpm build` → dist/cdn)
[assets]
directory = "./dist/cdn"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
CVO_CONTRACT_ID = "cvo.homepage.v1"

# Uncomment and set after creating a Cloudflare Pages project:
# [env.production]
# routes = [{ pattern = "cvo.example.com", custom_domain = true }]
